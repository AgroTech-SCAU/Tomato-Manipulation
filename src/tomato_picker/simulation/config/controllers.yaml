controller_manager:
  ros__parameters:
    update_rate: 200
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: forward_command_controller/ForwardCommandController
joint_trajectory_controller:
  ros__parameters:
    use_sim_time: true
    joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_partial_joints_goal: false
    open_loop_control: false
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.02
      joint1:
        trajectory: 0.12
        goal: 0.008
      joint2:
        trajectory: 0.12
        goal: 0.008
      joint3:
        trajectory: 0.12
        goal: 0.008
      joint4:
        trajectory: 0.12
        goal: 0.008
      joint5:
        trajectory: 0.12
        goal: 0.008
      joint6:
        trajectory: 0.12
        goal: 0.008
gripper_controller:
  ros__parameters:
    use_sim_time: true
    joints:
    - joint7-1
    interface_name: position
