# Tomato-Picker owns the complete downstream Robot Profile.
# SerialArm-Core resolves this external file through profile_file/resource_paths.
profiles:
  tomato_picker:
    core:
      package: tomato_picker_description
      config: config/core/tomato_picker.yaml

    hardware:
      plugin: serial_arm_hardware_damiao
      config_package: dm_arm_description
      config: config/hardware.yaml

    description:
      package: tomato_picker_description
      urdf: urdf/tomato_picker.urdf
      ros2_control_xacro: urdf/tomato_picker.ros2_control.xacro

    controllers:
      package: tomato_picker_bringup
      config: config/ros2_controllers.yaml
      spawn:
        - joint_state_broadcaster
        - joint_trajectory_controller

    moveit:
      package: tomato_picker_moveit_config
